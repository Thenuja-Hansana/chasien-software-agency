<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#050505',
                        neon: '#D4FFA3',
                        surface: 'rgba(255, 255, 255, 0.03)',
                        border: 'rgba(255, 255, 255, 0.08)',
                        accent: '#6366f1'
                    },
                    fontFamily: {
                        sans: ['Space Grotesk', 'sans-serif'],
                    },
                    backgroundImage: {
                        'grid-pattern': "linear-gradient(to right, #1a1a1a 1px, transparent 1px), linear-gradient(to bottom, #1a1a1a 1px, transparent 1px)",
                    },
                    animation: {
                        'pulse-neon': 'pulse-neon 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'infinite-scroll': 'infinite-scroll 40s linear infinite',
                    },
                    keyframes: {
                        'pulse-neon': {
                            '0%, 100%': { opacity: 1, boxShadow: '0 0 10px #D4FFA3' },
                            '50%': { opacity: .8, boxShadow: '0 0 20px #D4FFA3' },
                        },
                        'infinite-scroll': {
                            '0%': { transform: 'translateX(0)' },
                            '100%': { transform: 'translateX(-50%)' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="selection:bg-neon selection:text-void">

    <div id="cursor"></div>
    <div id="cursor-dot"></div>
    <div class="ambient-light" id="ambient-light"></div>

    <nav class="fixed top-0 w-full z-50 px-4 md:px-6 py-4 md:py-6 flex justify-between items-center mix-blend-difference bg-void/50 md:bg-transparent backdrop-blur-md md:backdrop-blur-none border-b border-white/5 md:border-none">
        <a href="#" class="text-xl md:text-2xl font-bold tracking-tighter hover-magnetic">CHASIEN.</a>
        
        <div class="hidden md:flex gap-8 text-sm uppercase tracking-widest text-gray-400">
            <a href="#about" class="hover:text-neon transition-colors hover-magnetic">Agency</a>
            <a href="#work" class="hover:text-neon transition-colors hover-magnetic">Case Studies</a>
            <a href="#testimonials" class="hover:text-neon transition-colors hover-magnetic">Trusted By</a>
        </div>

        <button onclick="document.getElementById('cta').scrollIntoView({behavior: 'smooth'})" class="px-5 py-2 md:px-6 border border-white/20 rounded-full text-[10px] md:text-xs uppercase tracking-widest hover:bg-neon hover:text-black hover:border-neon transition-all duration-300 hover-magnetic">
            Start Project
        </button>
    </nav>

    
    
</body>
</html>
